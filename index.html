<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>lifeOS</title>
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="lifeOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Pacifico&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">lifeOS <i class="ti ti-sparkles" aria-hidden="true"></i></h1>
    <span class="today" id="today"></span>
    <form class="qa" id="qa" autocomplete="off">
      <i class="ti ti-plus" aria-hidden="true"></i>
      <input id="qa-input" type="text" aria-label="Quick add"
        placeholder="Add a to-do…   #home  tomorrow 3pm   ·   n: note   ·   $12 Target">
    </form>
    <span class="sync" id="sync" title="Sync status"></span>
    <button class="btn" id="signin" type="button" hidden><i class="ti ti-brand-google-drive" aria-hidden="true"></i> Connect Drive</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="todo"><i class="ti ti-checkbox" aria-hidden="true"></i> To-do <span class="n" id="n-todo"></span></button>
    <button role="tab" data-tab="notes"><i class="ti ti-notes" aria-hidden="true"></i> Notes <span class="n" id="n-notes"></span></button>
    <button role="tab" data-tab="money"><i class="ti ti-coin" aria-hidden="true"></i> Money <span class="n" id="n-money"></span></button>
    <button role="tab" data-tab="log"><i class="ti ti-heart" aria-hidden="true"></i> Log <span class="n" id="n-log"></span></button>
  </nav>

  <main class="panel" id="panel"></main>
  <p class="msg" id="msg" hidden></p>
</div>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
